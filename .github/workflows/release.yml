name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip
        run: |
          mkdir dist
          zip -r "dist/enter-control-${{ github.ref_name }}.zip" manifest.json src/
          test -d icons && zip -r "dist/enter-control-${{ github.ref_name }}.zip" icons/ || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/enter-control-${{ github.ref_name }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
